<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCESO DENEGADO - Fast Shop Guatemala</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --aqua: #00C9A7; --aqua2: #00A98F; --dark: #0A0F1E;
            --card: #161D2F; --border: rgba(0,201,167,0.15);
            --text: #E8F0FE; --muted: #6B7A99; --error: #FF6B6B;
        }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: var(--dark); font-family: 'DM Sans', sans-serif; overflow: hidden;
        }
        body::before {
            content: ''; position: fixed; inset: 0; z-index: 0;
            background: radial-gradient(ellipse 70% 50% at 10% 0%, rgba(255,107,107,0.08) 0%, transparent 60%),
                        radial-gradient(ellipse 50% 60% at 90% 100%, rgba(0,119,255,0.06) 0%, transparent 60%);
            pointer-events: none;
        }
        body::after {
            content: ''; position: fixed; inset: 0; z-index: 0;
            background-image: radial-gradient(rgba(0,201,167,0.05) 1px, transparent 1px);
            background-size: 30px 30px; pointer-events: none;
        }
        .card {
            position: relative; z-index: 1;
            background: var(--card); border: 1px solid rgba(255,107,107,0.2);
            border-radius: 24px; padding: 52px 48px;
            max-width: 460px; width: 90%; text-align: center;
            box-shadow: 0 32px 80px rgba(0,0,0,0.5);
            animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
        }
        @keyframes slideUp {
            from { opacity:0; transform: translateY(30px) scale(0.97); }
            to   { opacity:1; transform: translateY(0) scale(1); }
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 24px; right: 24px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--error), transparent);
        }
        .icon-wrap {
            width: 72px; height: 72px; border-radius: 20px;
            background: rgba(255,107,107,0.10);
            border: 1px solid rgba(255,107,107,0.2);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px; font-size: 32px;
        }
        h1 {
            font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 700;
            color: var(--text); margin-bottom: 12px;
        }
        .desc {
            font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 20px;
        }
        .rol-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.2);
            border-radius: 100px; padding: 8px 16px; margin-bottom: 32px;
        }
        .rol-badge span { font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600; color: var(--error); }
        .rol-label { font-size: 13px; color: var(--muted); }
        .btn-home {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 13px 28px;
            background: linear-gradient(135deg, var(--aqua), var(--aqua2));
            border: none; border-radius: 12px;
            color: #0A0F1E; font-family: 'Outfit', sans-serif;
            font-size: 14px; font-weight: 700; text-decoration: none;
            transition: all 0.2s; box-shadow: 0 4px 16px rgba(0,201,167,0.25);
            cursor: pointer;
        }
        .btn-home:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,201,167,0.35); }
        .divider { height: 1px; background: rgba(255,255,255,0.06); margin: 24px 0; }
        .footer-text { font-size: 12px; color: var(--muted); }
        .footer-text strong { color: var(--aqua); }
    </style>
</head>
<body>
    <div class="card">
        <h1>ACCESO DENEGADO</h1>
        <p class="desc">No tienes permisos para acceder a este módulo. Contacta al administrador si crees que esto es un error.</p>

        <div class="rol-badge">
            <span>{{ session.nombre }}</span>
            <span class="rol-label">— sin acceso</span>
        </div>

        <br>
        <a href="/home" class="btn-home">
            <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            Volver al Inicio
        </a>

        <div class="divider"></div>
        <p class="footer-text">Fast Shop Guatemala &nbsp;·&nbsp; <strong>© 2026</strong></p>
    </div>
</body>
</html>
